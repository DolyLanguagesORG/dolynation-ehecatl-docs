name: docs-link-check

on:
  # Sin filtro de `paths`, por el mismo motivo que en los demás repos: los
  # checks exigidos por la protección de ramas deben reportar siempre.
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `actionlint` NO es una action de GitHub (no trae action.yaml) y las
      # imagenes de Docker Hub estan bloqueadas para Actions, asi que se
      # instala el binario con el script oficial del proyecto.
      - name: Instalar actionlint
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          chmod +x actionlint

      # Valida la SINTAXIS de los workflows, que es mas estricta que YAML:
      # claves duplicadas (GitHub rechaza el workflow entero y el run nace
      # sin jobs), expresiones invalidas, `uses:` sin version, etc.
      # `-shellcheck=` desactiva la integracion con shellcheck: aqui importa la
      # sintaxis, no el estilo de los scripts.
      - name: Validar los workflows del repo
        run: ./actionlint -color -shellcheck= .github/workflows/*.yml


  link-check:
    name: link-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          # Offline mode: only check that local file links resolve, don't
          # hit the network. External link checking can be enabled later
          # by removing --offline once the docs surface is stable.
          args: --offline --no-progress --exclude-loopback '**/*.md'
          fail: true

      # El regex de palabras clave de pr-labels.yml se copia una vez; este
      # test lo ejercita para que no se desincronice del workflow.
      - name: Test del regex de pr-labels
        run: node .github/workflows/pr-labels.regex.test.cjs
