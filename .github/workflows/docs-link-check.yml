name: docs-link-check

on:
  # Sin filtro de `paths`, por el mismo motivo que en los demás repos: los
  # checks exigidos por la protección de ramas deben reportar siempre.
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar los workflows del repo
        uses: rhysd/actionlint@v1
        with:
          args: -color

  link-check:
    name: link-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          # Offline mode: only check that local file links resolve, don't
          # hit the network. External link checking can be enabled later
          # by removing --offline once the docs surface is stable.
          args: --offline --no-progress --exclude-loopback '**/*.md'
          fail: true

      # El regex de palabras clave de pr-labels.yml se copia una vez; este
      # test lo ejercita para que no se desincronice del workflow.
      - name: Test del regex de pr-labels
        run: node .github/workflows/pr-labels.regex.test.cjs
