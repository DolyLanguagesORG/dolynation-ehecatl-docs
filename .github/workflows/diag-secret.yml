name: diag-secret
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Ver el secret
        env:
          T: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          echo "longitud: ${#T}"
          echo "primeros 4: ${T:0:4}"
          echo "ultimos 4: ${T: -4}"
          curl -s -o /dev/null -w "API con ese token -> %{http_code}\n" -H "Authorization: Bearer $T" https://api.github.com/user
