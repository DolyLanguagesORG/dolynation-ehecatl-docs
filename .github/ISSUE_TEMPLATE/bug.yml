name: Bug report
description: Reportar un error en la documentación.
title: "[bug] "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar un bug. Por favor incluye suficiente contexto para
        reproducir el problema y cita el caso de prueba (`TC-NNN`) de
        `plan/QA-PRUEBAS.md` si surgió durante QA.

        El índice central (`plan/BUGS.md`) asigna un identificador estable
        `BUG-NNN` automáticamente en orden cronológico (o respeta `[BUG-NNN]` si
        lo incluyes en el título).

  - type: textarea
    id: description
    attributes:
      label: Descripción
      description: Qué pasa.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      description: Cómo llegar al bug desde un estado limpio.
      placeholder: |
        1. Ir a '...'
        2. Ejecutar '...'
        3. Ver '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
      description: Qué debería pasar.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportamiento actual
      description: Qué pasa en realidad.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      description: Pega aquí los logs relevantes.
      render: shell

  - type: dropdown
    id: severity
    attributes:
      label: Severidad
      description: Impacto en el producto.
      options:
        - Baja — cosmético, no afecta funcionalidad
        - Media — afecta una feature pero hay workaround
        - Alta — bloquea una feature importante
        - Crítica — caída del servicio o pérdida de datos
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Entorno
      description: Dónde ocurre (`dev (VPN)`, `staging`, `prod` o `local`).
      placeholder: "dev (VPN) / staging / prod / local"

  - type: input
    id: commit
    attributes:
      label: Commit SHA o branch
      description: Si sabes en qué commit apareció por primera vez.